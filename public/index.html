      (function () {
        var r = document.documentElement;
        r.classList.add('js');
        try {
          var th = localStorage.getItem('bs-theme');
          if (th === 'light' || th === 'dark') r.setAttribute('data-theme', th);
          // la langue suit l'adresse : /en/... en anglais, le reste en français
